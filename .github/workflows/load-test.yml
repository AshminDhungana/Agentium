name: 2× Peak Load & Stress Testing Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/load-test.yml'
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  load-test-gate:
    name: Load & Stress Test Gate (21.5.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://agentium:agentium@localhost:5432/agentium_test
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CHROMA_HOST: localhost
      CHROMA_PORT: 8001
      CELERY_TASK_ALWAYS_EAGER: "true"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start test services
        run: |
          docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "=== Service startup logs ==="
          docker compose -f docker-compose.test.yml logs
          echo "=== Waiting for healthy services ==="
          for i in {1..60}; do
            sleep 2
            healthy_count=$(docker compose -f docker-compose.test.yml ps | grep -ci "healthy" || true)
            if [ "$healthy_count" -eq 3 ]; then
              echo "All 3 services healthy."
              break
            fi
            echo "Waiting for services ($healthy_count/3 healthy) — attempt $i/60"
          done
          if [ "$healthy_count" -ne 3 ]; then
            echo "ERROR: Services did not become healthy within the timeout."
            docker compose -f docker-compose.test.yml ps
            docker compose -f docker-compose.test.yml logs
            exit 1
          fi
          echo "=== Final service status ==="
          docker compose -f docker-compose.test.yml ps

      - name: Initialize test databases
        run: |
          PSQL_USER="$(docker compose -f docker-compose.test.yml exec -T postgres bash -lc 'echo "${POSTGRES_USER:-agentium}"' | tr -d '\r')"
          echo "Using DB user: $PSQL_USER"

          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T postgres bash -lc "pg_isready -U '$PSQL_USER'" >/dev/null 2>&1; then
              echo "Postgres is ready."
              break
            fi
            echo "Waiting for Postgres to be ready ($i/30)..."
            sleep 1
          done

          for db in agentium agentium_test; do
            echo "Ensuring database exists: $db"
            docker compose -f docker-compose.test.yml exec -T postgres \
              psql -U "$PSQL_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || \
              docker compose -f docker-compose.test.yml exec -T postgres \
                psql -U "$PSQL_USER" -d postgres -c "CREATE DATABASE $db"
          done

          echo "=== Verifying databases ==="
          docker compose -f docker-compose.test.yml exec -T postgres \
            psql -U "$PSQL_USER" -d postgres -c "\l" | grep -E "agentium|agentium_test"
        shell: bash

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run 2× Pool Saturation & Unit Tests
        env:
          CELERY_TASK_ALWAYS_EAGER: "true"
        run: |
          pytest backend/tests/load/test_connection_pool_load.py \
                 backend/tests/load/test_connection_pool_leak.py \
                 backend/tests/load/test_celery_throughput.py \
                 backend/tests/unit/test_sampler.py \
                 backend/tests/unit/test_baseline.py \
                 backend/tests/unit/test_websocket_user.py \
                 backend/tests/unit/test_load_report.py \
                 --no-cov -v

      - name: Execute Quick Load Test Gate
        run: |
          python -m backend.tests.load.orchestrator --mode quick --duration 60 --users 150 --gate

      - name: Upload Load Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: |
            backend/tests/load/load_report.html
            backend/tests/load/load_report.json
            backend/tests/load/baseline.json

      - name: Tear down test services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down

